# Keeps the SHA-pinned actions in .github/workflows current. Updates wait two weeks after release
# so a compromised release has time to be caught before it lands here.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions:
        patterns: ['*']
