name: Deploy to Cloudflare Pages

# main → production; pull requests from this repo → a preview URL per PR.
#
# Security (this repo is public):
# - Triggered by `pull_request`, never `pull_request_target`: workflows for PRs from forks get a
#   read-only token and no secrets, and don't deploy.
# - `build` runs the repo's code and npm packages but never sees a secret.
# - `deploy` holds the Cloudflare token but runs no project code: it takes the built site from `build`
#   and runs a pinned wrangler from npm.
# - Third-party code is pinned: actions by full commit SHA (Dependabot proposes updates), wrangler by
#   exact version. Event text (branch names, commit messages) only reaches the shell via env vars.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  WRANGLER: wrangler@4.147.0

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck and build
        run: npm run build

      - name: Guard against shipping model files
        run: |
          big=$(find dist -type f -size +24M)
          if [ -n "$big" ]; then echo "Files over Cloudflare Pages' 25 MiB limit:"; echo "$big"; exit 1; fi
          models=$(find dist -type f \( -name '*.glb' -o -name '*.gltf' \))
          if [ -n "$models" ]; then echo "Model files must not ship in dist/ (they're served from R2):"; echo "$models"; exit 1; fi

      # Everything `wrangler pages deploy` needs: the built site, the Function and the R2 binding.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: |
            dist
            functions
            wrangler.toml
          if-no-files-found: error
          retention-days: 3

  deploy:
    needs: build
    # PRs from forks and Dependabot don't get the secrets, so they stop at the build.
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24 # wrangler 4 needs Node 22+

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          MESSAGE: ${{ github.event.pull_request.title || github.event.head_commit.message || 'Manual deploy' }}
        run: |
          set -o pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets (see README → Deploy)."
            exit 1
          fi
          msg=$(printf '%s' "$MESSAGE" | head -n 1 | cut -c1-200)
          npx --yes "$WRANGLER" pages deploy --project-name=knowyourcar \
            --branch="$BRANCH" --commit-hash="$COMMIT" --commit-message="$msg" | tee deploy.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.pages\.dev' deploy.log | tail -n 1 || true)
          echo "### Deployed 🚀" >> "$GITHUB_STEP_SUMMARY"
          echo "${url:-see the log above}" >> "$GITHUB_STEP_SUMMARY"
